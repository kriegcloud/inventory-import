proposed_referent:
  label: Named access-level concepts
  description: 'Candidate referents: viewer, editor and admin access-level concepts; custom levels are
    mentioned without asserting additional current instances. These chains instantiate one kind of controlled
    concept, not kinds of human beings. Each concept is individuated by scheme and notation, and describes
    a specified level of permitted workspace activity. Holding it is separately represented by a scoped
    assignment.'
representation_status: information_artifact
alternatives:
- label: String literals used solely as implementation branch keys
  representation_status: implementation_artifact_only
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: The supplied permission meanings and explicit scheme-and-notation identity support controlled
    information concepts. The source alias observations provide no extra behavioral proof, and no permission
    entities are inferred.
  discriminator: 'The prose assigns different normative contents to the concepts: viewer may read and
    write none, editor may read and write but not manage people, admin may additionally manage people.
    These are descriptions of access entitlements held through grants, not merely three opaque literal
    spellings.'
epistemic_status: proposed
