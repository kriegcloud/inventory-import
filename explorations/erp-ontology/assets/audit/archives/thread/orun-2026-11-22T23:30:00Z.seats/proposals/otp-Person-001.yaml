alternatives_rejected:
- 'Foundational analysis rejects: Account or membership information object as the human itself; contradicted
  by the explicit duplicate-record decision.'
- 'Foundational analysis rejects: Tenant-contact role of a human, useful as a separate participation predicate
  but not the referent of this identity commitment.'
- 'Implementation-only null rejected on the supplied discriminator, not merely on the existence of a field:
  The prose explicitly distinguishes the human bearer from representations and organization-specific memberships.
  This supports the intended domain denotation, without proving the fixture actually resolves a human.'
open_issues:
- 'Steward identity commitment: the same human individual for life and after death. Duplicate records, copies,
  account edits, account merging, two memberships, removal or re-adding membership neither multiply nor fuse
  humans. No name, email or account/member id supplies human identity. Human-resolution implementation is not
  established.'
- 'Strongest counterexample carried forward: One human has two Member records, later one is removed and both
  account details change. Neither operation creates another human; death also does not end Person identity
  under the supplied decision. A living-organism-only interpretation would conflict with this post-death stipulation.'
- 'Identity-card alternatives carried forward: Tenant-contact role is separate from the human bearer; no automatic
  equivalence to the People-page Person type.'
- 'Existential dependencies carried forward: No particular tenant, account, membership, name or email is necessary
  to the human continuing to be that individual (po:409cfb4d8ae1 and po:79e6720f1b1d). Being dealt with by
  a tenant selects relevant humans; it does not define a new kind.'
- 'Reuse search scope: the supplied gist 14.1.0 projection and thin-thread design only; no separate reuse dispositions
  or external search results were supplied. No exact local-term replacement was established within this bounded
  search.'
- 'Evidence boundary: the hypothesis discriminator is a supplied prose/design assertion, not a live test. Quoted
  discriminator from dh:human-person:001: “The quoted identity decision says two records of the same human
  denote one Person, an account or member id never identifies that person, and the same human persists after
  death. Those record-independent identity commitments would be false if the intended referent were only the
  records.” The claim must fail for a pure data-transfer twin: record-independent human continuity cannot be
  constituted by copying or changing records.'
- 'Joined IdentityCard provider fields: identity.supplies_identity=true; ontoclean.supplies_identity=true;
  ontoclean.carries_identity=true. Closed proposal identity value=supplies. No unresolved provider is promoted
  to true.'
- 'Hypothesis alternative preserved (not automatically rejected): An account or tenant-specific membership
  record; representation_status=information_artifact; plausibility=viable.'
