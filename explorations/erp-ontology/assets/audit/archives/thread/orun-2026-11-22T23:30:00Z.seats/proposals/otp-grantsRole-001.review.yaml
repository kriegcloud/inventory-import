revision_requests:
  - "Do not warrant grantsRole only as semantic support for otp:Grant:001. CQ-P11 and CQ-P06 ask which role is held; M.role already states it (po:c4054ec5a4fd). A grant edge is not required."
  - "Replace the shared discriminator. The normative reading of member.role is already the implementation field plus po:559ba5ec7c7d; it is not a fact that field lacks."
attacks:
  - surface: warrant
    rule: supports-non-decision-term
    counterexample: "semantic_support_for lists only otp:Grant:001. CQ-P06 asks which role each member holds and po:773104c28ed4 records that this is answerable from the role written on the member. CQ-P11 adds scope, which po:c4054ec5a4fd fixes as organization for that same field. po:11d1b53834c3 (\"links a grant to the role it gives\") describes the drafted edge; it does not show a decision term that is unanswerable without grantsRole. Supporting a non-required Grant class is not a warrant."
    outcome: landed
  - surface: null_discriminator
    rule: discriminator-true-of-dto
    counterexample: "M.role = admin, with no grant row (po:4ddf67948771). po:559ba5ec7c7d already calls that an authorized assignment of one role at one scope. The discriminator's joint member-role-extent fact is true of the field. An object property from a manufactured <M>/role node to a Role individual is not something the field lacks."
    outcome: landed
  - surface: identity
    rule: identifier-is-identity
    counterexample: "The proposal mints no property individual and leaves the joined assignment criterion unresolved. <M>/role naming viewer, admin, and viewer in succession is conceded not to be identity. No separate false identity claim is added for the property."
    outcome: survived
