revision_requests:
  - "The identity criterion individuates a description token by entry version, but the term is a data property with range xsd:string. Either reify the token or adopt string identity and drop the token criterion."
  - "Drop 'Parent Activity.id plus action field' as a reidentification key until a version policy exists. Two entries worded 'Imported items' are one string and two tokens under the current text."
  - "Replace the null discriminator. so:sha256:7cb3432045189b6713a9cc8eb9ca1f9dca366a96634f7d51c4ac7083a8dd98b9 already is a string field described as words a person reads."
attacks:
