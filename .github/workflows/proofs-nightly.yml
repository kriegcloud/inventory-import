name: Proofs, every night

# Every proof of the review's model, the search of the whole model, the property that holds it against the review
# region, and every mutant of it, again with nothing replayed, once a night and on request. The job in ci.yml replays
# each result until what it reads changes, and runs only a sample of the mutants; these jobs do not, so what changed
# under them (the runner's image, a solver that answers otherwise) shows here. A failure of either job opens one
# issue, or adds a comment to it while it is open. GitHub turns a schedule off, without a word, after 60 days in which
# a public repository had no commit: turn it on again from the Actions tab, or with `gh workflow enable`.
on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One at a time, and a run that has started is never cancelled by the next.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  proofs:
    name: The proofs, the search and the fold, nothing replayed
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The step has its own limit, shorter than the job's: a step that runs out of time fails, and the step below
      # then opens the issue; a job that runs out of time is cancelled, and nothing after it runs.
      - name: Prove, search and fold, nothing replayed
        timeout-minutes: 100
        run: bunx turbo run prove verify fold --force --concurrency=2 --summarize
      - name: Open the issue, or add to it
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const label = "proofs-nightly"
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = `The nightly run of the model's proofs and search failed: ${run}`
            // The list holds pull requests too: only an issue is commented on.
            const open = await github.rest.issues.listForRepo({ ...context.repo, labels: label, state: "open", per_page: 100 })
            const issue = open.data.find((item) => item.pull_request === undefined)
            if (issue !== undefined) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title: "The nightly proofs failed", body, labels: [label] })
            }

  # Every mutant of the model but the slow one (packages/catalog/model/mutants/README.md): 190 changes, each run
  # against its proof and the stories. Measured on a busy workstation for the first 148, four at a time: 5,402 s of
  # test time in 24 minutes. On this runner, four cores each about half as fast, four at a time: about an hour, and
  # the step's limit leaves room for twice that. Not measured on this runner.
  mutants:
    name: Every mutant of the model but the slow one, nothing replayed
    runs-on: ubuntu-latest
    timeout-minutes: 260
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Run every mutant but the slow one, nothing replayed
        timeout-minutes: 240
        run: bunx turbo run mutants --force --summarize -- --jobs 4 --except row-open
      - name: Open the issue, or add to it
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const label = "proofs-nightly"
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = `The nightly run of the model's mutants failed: ${run}`
            // The list holds pull requests too: only an issue is commented on.
            const open = await github.rest.issues.listForRepo({ ...context.repo, labels: label, state: "open", per_page: 100 })
            const issue = open.data.find((item) => item.pull_request === undefined)
            if (issue !== undefined) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title: "The nightly proofs failed", body, labels: [label] })
            }

  # The slow mutant, alone: `row-open` (the check that the import is open, removed from DecideRow) has the prover
  # confirm five broken rules, 1,531 s by itself on the workstation. Run with the other mutants it shares four cores
  # with three of them, and a run that only ran out of time would fail the whole job with nothing known of the
  # rest. Here it has the runner to itself and its own limits: the proof test's, made 100 minutes in the runner's
  # copy only (`--proof-limit`; the test file keeps its 50, which the proofs' jobs are sized for), the runner's for
  # one run (110) and the step's (130). At half the workstation's speed it would take about 51 minutes; not measured on
  # this runner. When this job fails, the model's mutants above are not in question: its log says whether the mutant
  # was not held, or ran out of time, in which case nothing is known of it and the limits are what to look at.
  slow-mutant:
    name: The slow mutant of the model, alone
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The runner is called without turbo here, so the check its task waits for is run by name: what is installed
      # holds the repository's patches, or the mutant would be proved against the library as published.
      - run: bun run patches:installed
      - name: Run the slow mutant
        timeout-minutes: 130
        run: python3 -I packages/catalog/model/mutants/run.py --only row-open --jobs 1 --nice 0 --proof-limit 6000 --timeout 6600
      - name: Open the issue, or add to it
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const label = "proofs-nightly"
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = `The nightly run of the model's slow mutant (row-open) failed: not held, or out of time (its log says which): ${run}`
            // The list holds pull requests too: only an issue is commented on.
            const open = await github.rest.issues.listForRepo({ ...context.repo, labels: label, state: "open", per_page: 100 })
            const issue = open.data.find((item) => item.pull_request === undefined)
            if (issue !== undefined) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title: "The nightly proofs failed", body, labels: [label] })
            }
