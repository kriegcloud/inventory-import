attacks:
  - surface: identity
    rule: "identity-criterion-underspecified"
    counterexample: "Grant G is stored against membership M1, then corrected to M2, the membership that was meant. The criterion says the same relation concerns the same assignment episode and the same recipient membership. If the correction is one conferral, M1 and M2 are one relation and the criterion separates them. If the correction is a new grant, one grant id identifies them and the criterion separates them. The card says which case it is is unresolved."
    outcome: landed
  - surface: identity
    rule: "identifier-is-identity"
    counterexample: "Tried: the human's id is the recipient. The criterion says the human alone is insufficient across tenants, so two memberships of one human are not one grantedTo pair."
    outcome: survived
  - surface: warrant
    rule: "listing-cq-warrant"
    counterexample: "CQ-P06 asks which role each member holds. The SPARQL path uses inv:grantedTo because it first invented inv:Grant. The sample rows are member and role. A membership that carries a role answers the listing with no grant-recipient property."
    outcome: landed
  - surface: null_discriminator
    rule: "discriminator-true-of-dto"
    counterexample: "Pure-DTO twin: a grant.memberId foreign key commented with po:sha256:92c9f8e574302fba49371237bfe913c0c42fa79a782cda78796abe665859fdcd ('Links a grant to the member who holds it') and po:sha256:bdf8ad74d87fbd47c5a9d0bf4597dc23d4336fd11c2345134a302ee78440965a. The discriminator says holding the grant denotes a recipient beyond a storage pointer. The only facts in the observations are those two sentences, which the foreign key's comments still have."
    outcome: landed
