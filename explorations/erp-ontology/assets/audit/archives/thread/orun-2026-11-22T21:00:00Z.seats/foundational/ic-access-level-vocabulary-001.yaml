id: ic:access-level-vocabulary:001
hypothesis_ref: dh:access-level-vocabulary:001
identity:
  supplies_identity: unresolved
  identity_criterion: 'Provisional: one vocabulary-version content with its access meanings and ranking;
    different serializations or deployments can realize the same content. A changed meaning or order yields
    different version content on this reading. Unresolved: equivalent reformulations, version succession
    and content-versus-issued-edition identity are not governed.'
  reidentification_key: []
ontoclean:
  rigidity: rigid
  carries_identity: true
  supplies_identity: unresolved
  unity: unity
  dependence: unresolved
ufo_analysis:
  candidate_category: information_object
  alternatives:
  - Issued vocabulary edition whose provenance individuates otherwise equal content.
  - Implementation enumeration only; the quotation proposes content but does not prove separate maintenance.
  existential_dependencies:
  - Requires some information realization generically; not tied to a particular schema object, server
    or current grant holder. An independently maintained publisher or normative authority is not established.
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: false
  terminal_states:
  - Version content is fixed on the proposed reading; withdrawal ends use, not automatically the information
    object.
counterexamples:
- description: Two schema objects serialize the same ranked meanings, while an unchanged literal list
    receives a new permission interpretation. Object identity and literal equality both misidentify vocabulary-version
    content.
status: proposed
