attacks:
  - surface: identity
    rule: "identity-criterion-underspecified"
    counterexample: "Scheme S1 ranks viewer, editor, admin by the words 'reads', 'writes', 'manages people'. Scheme S2 uses the paraphrases 'may read records', 'may write records', 'may add, change, and remove people' in the same order. 'One vocabulary-version content' can identify them as the same meanings or separate them as different formulations. The criterion says equivalent reformulations are not governed, so S1 and S2 are one scheme and two."
    outcome: landed
  - surface: identity
    rule: "identity-conflict"
    counterexample: "The proposal records that section 2.3 gives the scheme no identity criterion of its own, while the card individuates vocabulary-version content. A republished copy of the same three concepts is the same scheme under the design note and a different edition under provenance-sensitive identity. The two statements identify and separate that copy."
    outcome: landed
  - surface: warrant
    rule: "listing-cq-warrant"
    counterexample: "CQ-P06 asks who the members are and which role each holds. required_schemes names MemberRoleScheme because the sketch uses it. The sample answer's role values are the labels admin and viewer. The listing is answered by those labels without a concept-scheme individual."
    outcome: landed
  - surface: warrant
    rule: "support-term-unnamed"
    counterexample: "If the scheme exists only to fix the meaning of Role, it is a semantic-support term and semantic_support_for is empty. It does not name Role, and it does not name any other decision term. A support chain that names nothing warrants nothing."
    outcome: landed
  - surface: null_discriminator
    rule: "discriminator-true-of-dto"
    counterexample: "Pure-DTO twin: so:sha256:4f7c7c864d772a2f736f7b40c07f6e23f253203896ed44c657a96062c829e563, the viewer/editor/admin enum, whose description ranks read, write, and managing people, together with the sentence po:sha256:f37962927f2b535604cb61961ace9335b1c86887f87b34c62bfde0dd0d1866e9. The discriminator says the prose proposes organized access meanings beyond literals, and then admits separate maintenance is not established. The enum makes the cited fact true."
    outcome: landed
