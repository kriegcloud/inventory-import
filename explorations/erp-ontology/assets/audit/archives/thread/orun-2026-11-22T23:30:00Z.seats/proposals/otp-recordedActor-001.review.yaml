no_surface_reasons:
  taxonomy: "parents is empty. No is-a edge is proposed for this object property, so superclass rigidity, identity, unity, and dependence checks have no edge to apply to."
revision_requests:
  - "Keep CQ-P10 as the warrant: the question asks which member the entry names, and po:160303617dee forbids substituting the actual actor. Replace the discriminator. An actorId foreign key already names a member and does not prove agency, so po:160303617dee and po:c8e8fdebd997 are true of that column."
attacks:
  - surface: null_discriminator
    rule: discriminator-true-of-dto
    counterexample: "Activity row E stores actorId = M. po:c8e8fdebd997 says the link names the member the entry says made the change, and po:160303617dee says the entry cannot prove who made it and rewords the question to which member it names. Both are true of the foreign key. A transfer column that is never read as a claim would be a different twin; the implementation that already is the audit row makes the discriminating sentences true. The discriminator does not reject implementation-only."
    outcome: landed
  - surface: warrant
    rule: listing-cq-warrant
    counterexample: "CQ-P10 asks which member each audit entry names, and its decision says the entry does not prove who made the change. recordedActor is that naming. A writing time and an action string do not say which member was named, and the actual actor relation is the reading the question retired. The natural language requires the term; the required_properties list is not the warrant."
    outcome: survived
  - surface: identity
    rule: identifier-is-identity
    counterexample: "E names M, and the naming is false. A second snapshot of the same endpoints is a different assertion only if the snapshot changed, which is the proposal's relational-equality claim, not a new relator identified by a key. supplies_identity and carries_identity are false. No sortal criterion is asserted to attack, and the false attribution is not treated as proof. The attack does not land."
    outcome: survived
rival_models_still_viable:
