proposed_referent:
  label: Recorded attribution of a change to a member
  description: An information-bearing attribution in an audit entry naming the member
    said to have made the change. An instance is one entry and its recorded member
    attribution, not proof of actual responsibility.
representation_status: information_artifact
alternatives:
- label: Actual agency in the change
  representation_status: domain_referent
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: The quoted meaning supplies a candidate with participants or communicative
    content beyond the source declaration. This supports intended denotation only;
    it does not verify any live instance or implemented guarantee.
  discriminator: The quotations expressly say the record names who made the change
    and links to that member; the excerpt separates actor identifier from the name
    as it was then. Such attribution is communicative content about an actor, not
    just field syntax; truth of the attribution remains unverified.
epistemic_status: proposed
