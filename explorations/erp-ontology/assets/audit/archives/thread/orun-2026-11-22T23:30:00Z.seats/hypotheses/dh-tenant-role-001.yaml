proposed_referent:
  label: Organization hosting an application workspace
  description: 'Candidate referent: the tenant capacity of an organized body for which the application
    maintains a workspace and separates records. An instance is the particular body in that workspace-bearing
    relation, inheriting body identity; OrganizationId is a repository handle rather than a proof of legal
    identity. Successor bodies can take over the same workspace.'
representation_status: domain_referent
alternatives:
- label: The workspace partition or database tenant key alone
  representation_status: implementation_artifact_only
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: The supplied tenancy isolation account motivates a workspace role of an organizational bearer,
    while the succession decision separates bearer identity from database addressing.
  discriminator: The prose distinguishes the legal body from the retained workspace and says the Tenant
    role passes to a successor organization. A role borne by distinct legal bodies across succession cannot
    be identical to an unchanged partition key alone.
epistemic_status: proposed
