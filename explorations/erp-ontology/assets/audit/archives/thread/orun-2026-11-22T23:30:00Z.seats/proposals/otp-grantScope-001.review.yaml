revision_requests:
  - "Do not warrant grantScope only as support for otp:Grant:001. CQ-P11 asks for the extent, and the proposal mints neither a scope individual nor GrantScopeKindScheme, so the property has no admitted object that could answer the question."
  - "Replace the shared discriminator. member.role read as one organization-scoped grant (po:c4054ec5a4fd, po:19ca3041dabc) already states the extent without this property."
attacks:
  - surface: warrant
    rule: supports-non-decision-term
    counterexample: "The only warrant is semantic_support_for otp:Grant:001. CQ-P11's sample answer is scope GrantScopeKindScheme-organization. po:19ca3041dabc says that one concept ships, but this proposal's own terms mint no scope individual and no scheme, and it declares no OWL range. Member M with role admin, read as organization scope by po:c4054ec5a4fd, answers \"at which scope\" with no Grant and no grantScope edge. Support for an unrequired class, pointing at an unadmitted object, does not make grantScope necessary for a decision term. po:218d99fcdef2 only glosses the edge the SPARQL already assumed."
    outcome: landed
  - surface: null_discriminator
    rule: discriminator-true-of-dto
    counterexample: "No grant row exists (po:4ddf67948771). Today's member.role is defined to be one grant at organization scope (po:c4054ec5a4fd), and po:19ca3041dabc ships that one extent. A member row plus the constant organization makes the discriminator's \"which member, which role, which extent\" true. grantScope is not a fact that constant lacks."
    outcome: landed
  - surface: identity
    rule: identifier-is-identity
    counterexample: "Scope is a constant on the lifted member-role node, not a separately identified individual. The proposal says the joined card mints no property individual and leaves assignment identity unresolved. The technical address <member IRI>/role is not asserted as this property's identity."
    outcome: survived
