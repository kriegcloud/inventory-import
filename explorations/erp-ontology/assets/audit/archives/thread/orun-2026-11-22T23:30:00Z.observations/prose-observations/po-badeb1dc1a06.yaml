quote: "A scheme has no kind tag, no gist parent and no identity criterion of its own. Its key ends in `Scheme` (decision 10). The rank of the roles is the rule of `hasRole` in `packages/kernel/src/Role.schema.ts`; it is not written as `skos:broader`."
