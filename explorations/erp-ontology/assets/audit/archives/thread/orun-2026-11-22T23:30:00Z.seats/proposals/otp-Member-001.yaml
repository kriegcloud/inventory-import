alternatives_rejected:
- 'Implementation-only null rejected on the supplied discriminator, not merely on the existence of a field:
  The relationship semantics, finite authorization interval and independent human bearer supply more than the
  presence of an id field. This does not prove production membership history.'
open_issues:
- 'FLAGGED FOR STEWARD — foundational_status explicitly_deferred; this proposal does not settle the foundational
  question. Needed evidence: Supply creation/removal/rejoining and duplicate-member examples with effective
  dates, person resolution and key reuse rules; decide whether a removed membership ceases or persists inactive
  and what separates two membership establishments. The proposed relator rigidity concerns being a membership
  relator, not the human retaining a role.'
- 'Steward thin-thread identity convention: “the MemberId within its tenant, kept after removal.” It identifies
  the retained projection, not a proved persisting authorization relationship after removal. Same human in
  two tenants gives distinct memberships. Whether re-adding under an old handle continues the relationship,
  whether duplicate/copied rows denote one establishment, and whether a bearer edit replaces it are unresolved.
  Do not substitute the person-tenant pair as a resolved criterion.'
- 'STEWARD CHOICE REQUIRED — this is one provisional term shape, not a merged or chosen rival model. Choose
  explicitly among: Membership relator with creation/removal episodes; Anti-rigid member role of the human,
  with the continuing human supplying identity; Retained membership information object documenting an ended
  relation. This synthesis makes no selection by omission. The selected model may require a revised proposal
  or a separate future candidate; no such additional term is admitted in this 18-key scope.'
- 'Strongest counterexample carried forward: Remove a member and later recreate access for the same human in
  the same tenant, perhaps reusing a handle. Two different establishments and one suspended relation fit the
  same current row projection; no supplied history distinguishes them.'
- 'Identity-card alternatives carried forward: role; information_object'
- 'Existential dependencies carried forward: Mediates a human and tenant workspace context, with the authorization
  interval from creation to removal (po:8b535e25c8a2). Dependence is on those participants for the active relation,
  not on a display name or account. A retained post-removal record can exist after this active relation ends.'
- 'Reuse search scope: the supplied gist 14.1.0 projection and thin-thread design only; no separate reuse dispositions
  or external search results were supplied. No exact local-term replacement was established within this bounded
  search.'
- 'Evidence boundary: the hypothesis discriminator is a supplied prose/design assertion, not a live test. Quoted
  discriminator from dh:workspace-membership:001: “The prose explicitly describes a relation that permits workspace
  action only from creation until removal, and the two-member/one-human example distinguishes membership identity
  from human identity. A display or session record alone has neither that interpersonal relation nor its stated
  duration of authorization.” The claim must fail for a pure data-transfer twin: active workspace authorization
  ends at removal even when its identifier is retained; transfer-only rows supply no authorization lifecycle.'
- Parent withheld pending identity and rival-model resolution. The proposed thin-thread parent is a candidate
  only; no ancestor identity supplier has been established for this unresolved branch.
- 'Warrant necessity: CQ-P06 asks for tenant-specific memberships and their held access levels; human identity
  or an unscoped role value alone cannot distinguish the same human’s two workspace authorizations.'
- 'Joined IdentityCard provider fields: identity.supplies_identity=unresolved; ontoclean.supplies_identity=unresolved;
  ontoclean.carries_identity=unresolved. Closed proposal identity value=unresolved. No unresolved provider
  is promoted to true.'
- 'Hypothesis alternative preserved (not automatically rejected): A member row or session actor snapshot alone;
  representation_status=information_artifact; plausibility=viable.'
