proposed_referent:
  label: Human being
  description: 'Candidate referent: a human dealt with by a tenant. Grouped chains distinguish that human
    from account and member records and allow one human to hold multiple memberships. One instance is
    one human for life and after death; duplicate records do not create additional humans. No People-page
    Person projection is equated with this referent.'
representation_status: domain_referent
alternatives:
- label: An account or tenant-specific membership record
  representation_status: information_artifact
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: The prose explicitly distinguishes the human bearer from representations and organization-specific
    memberships. This supports the intended domain denotation, without proving the fixture actually resolves
    a human.
  discriminator: The quoted identity decision says two records of the same human denote one Person, an
    account or member id never identifies that person, and the same human persists after death. Those
    record-independent identity commitments would be false if the intended referent were only the records.
epistemic_status: proposed
confidence:
  value: 0.85
  use_for_acceptance: false
