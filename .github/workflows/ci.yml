name: CI

on:
  push:
    # A release branch is checked as main is: a fix cherry-picked onto it is green before its tag is pushed.
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Through turbo: type-check, lint, fast and slow tests, the production build, format and docs checks.
      # The runner has four cores. Turbo would start ten tasks at once and each test run a worker per core, which
      # made tests several times slower than they are and failed them on their limits; two tasks at a time with one
      # test worker each is what four cores carry (measured: docs/standards/engineering.md, "The check on CI").
      # `--continue` runs every task even after one fails, so a red run lists everything that is wrong.
      - name: Check, test and build
        run: bun run check:full -- --summarize --continue --concurrency=2
        env:
          VITEST_MAX_WORKERS: 1
      # The data grid's typing, in a real browser: what is typed on a cell is what is stored. The runner image has
      # Chrome at this path (CHROME_BIN in actions/runner-images; the runs are on Ubuntu 26.04, whose image lists
      # Google Chrome as 24.04's does). The browser says its version first,
      # so a path that is wrong fails on that line with the path in it.
      # It runs when the check above failed as well, so a red run says whether the grid still stores what is typed; the
      # job still fails on the check's failure. Not on a cancelled run.
      - name: Type on the data grid
        if: ${{ !cancelled() }}
        run: |
          "$CHROME_PATH" --version
          bun run --cwd apps/inventory grid:keys
        env:
          CHROME_PATH: /usr/bin/google-chrome
