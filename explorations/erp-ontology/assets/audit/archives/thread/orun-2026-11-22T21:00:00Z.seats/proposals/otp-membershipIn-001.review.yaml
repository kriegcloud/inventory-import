revision_requests:
  - "CQ-P06 asks for members of an organization. The range is Tenant. A supplier organization the tenant buys from (po:sha256:f06f5414bdd1e4bb71616923bd5302bd87856d08eb6d6d3fe12eb852639d6b7b, cited by Organization) is an organization in that question and not a Tenant. Do not claim membershipIn answers the CQ for those organizations."
