quote: "Anything that writes starts with `yield* requireRole(\"editor\")` (or `\"admin\"`). The UI mirrors the rule with `hasRole` so nobody is offered a button that will be refused. A write is safe to send twice: it names what it acts on (an upload's key, the revision an edit was made on, an import still open), so a retry writes once; `newRequestId()` makes a key once per press for a new write that has nothing of its own. A write from another site is refused before identity (`SameOrigin`)."
