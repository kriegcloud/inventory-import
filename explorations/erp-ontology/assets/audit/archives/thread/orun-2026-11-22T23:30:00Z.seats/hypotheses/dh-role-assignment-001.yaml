proposed_referent:
  label: Scoped assignment of a role to a member
  description: 'Candidate referent: one role assigned to one member at one extent by an authorized member.
    The grouped chains connect recipient, access level and scope; current member.role is interpreted as
    one assignment at organization scope. An instance in the thin thread is individuated by the member
    and the role field, not an invented stored grant id. This present projection cannot distinguish successive
    assignment episodes; historical assignment identity is unresolved.'
representation_status: domain_referent
alternatives:
- label: A derived node manufactured solely to express member.role and a constant scope
  representation_status: implementation_artifact_only
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: The scope-sensitive access decision supplies a referent beyond the derived node syntax. The
    member-and-field construction is only the supplied thin-thread individuation convention, not evidence
    of separate grant occurrences or a stored lifecycle.
  discriminator: The prose describes an authorized assignment that jointly determines which member holds
    which role at which extent, and explicitly distinguishes organization-wide from narrower access for
    the action-offering decision. That contextual access assignment is the intended relationship even
    though no grant row exists.
epistemic_status: proposed
confidence:
  value: 0.85
  use_for_acceptance: false
