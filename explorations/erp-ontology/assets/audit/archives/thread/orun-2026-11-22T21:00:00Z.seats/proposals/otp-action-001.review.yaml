    rule: "identity-conflict"
    counterexample: "Entry A and entry B are both worded 'Imported items', the example in so:sha256:7cb3432045189b6713a9cc8eb9ca1f9dca366a96634f7d51c4ac7083a8dd98b9. The criterion says equal wording is not token identity. The data property's range is xsd:string, whose identity is the wording. The proposal therefore identifies the two descriptions and separates them."
    outcome: landed
  - surface: identity
    rule: "identifier-is-identity"
    counterexample: "reidentification_key is 'Parent Activity.id plus action field and entry version', and the version policy is absent. Edit the wording on the same Activity.id without a new version: the key identifies the old wording with the new one. Reissue Activity.id for a second serialization of the same token: the key separates one token into two."
    outcome: landed
  - surface: warrant
    rule: "listing-cq-warrant"
    counterexample: "Tried: CQ-P10 merely mentions action. The question asks what was done, and the sample answer's action field is 'Imported items'. That conjunct is unanswerable without the wording the property carries."
    outcome: survived
  - surface: null_discriminator
    rule: "discriminator-true-of-dto"
    counterexample: "Pure-DTO twin: the action field on Activity in so:sha256:7cb3432045189b6713a9cc8eb9ca1f9dca366a96634f7d51c4ac7083a8dd98b9, annotated 'What was done, in a few words a person reads', plus po:sha256:4f84af70495b7304f5a3e7b576f8ad387255992240c31f7818b983dd431aa438. The discriminator says those texts describe words a person reads. They do, and they remain true if action is only a string column."
    outcome: landed
