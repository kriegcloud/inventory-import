quote: "I chose the party itself: `Organization` names the real body and `Person` the human. The row a tenant imports, matches and reviews is a `SourceRecord` linked to it by `recordOf`, reidentified by tenant, source system, source type and exact source id; two records a tenant holds that may be one party are joined only by an `IdentityDecision`. The agent recommended the same. This amends decision 3: the Sutton Account is the organization, and what is imported is the tenant's record of it."
