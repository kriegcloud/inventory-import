definition:
  text: A controlled vocabulary of access-level meanings a member may hold in an organization, ranked
    by intended abilities. The closed thin-thread concept list is MemberRoleScheme-viewer (read records
    and write none), MemberRoleScheme-editor (read and write records without managing people), and MemberRoleScheme-admin
    (read and write records and add, change and remove people). These entries are skos_concept values;
    their rank is not a skos:broader hierarchy.
