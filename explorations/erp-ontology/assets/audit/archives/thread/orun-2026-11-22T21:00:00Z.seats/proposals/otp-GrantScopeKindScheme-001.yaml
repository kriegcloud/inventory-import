definition:
  text: A controlled vocabulary distinguishing kinds of extent covered by access assignments, including
    organization-wide, location and field extents. The thin-thread proposal lists only GrantScopeKindScheme-organization
    (the whole organization) as a skos_concept. The scheme is open to later proposals; no location or
    field concept is proposed in this pass.
