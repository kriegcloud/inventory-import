id: ic:recorded-actor-link:001
hypothesis_ref: dh:recorded-actor-link:001
identity:
  supplies_identity: false
  identity_criterion: 'No independent individual is required: proposed typed recorded-attribution relation
    from an audit entry to the Member reference it asserts in a given entry version/snapshot. Two equal
    assertions have the same entry, referenced member and evaluation context; this is relational equality,
    not a supplied identity criterion for a new relator. Persistence through state change is not asserted
    for a separate individual; changing an endpoint or snapshot changes the contextual assertion.'
  reidentification_key:
  - Audit entry handle
  - Recorded Member reference
  - Entry version or snapshot where available
ontoclean:
  rigidity: unresolved
  carries_identity: false
  supplies_identity: false
  unity: non_unity
  dependence: relational
ufo_analysis:
  candidate_category: none
  alternatives:
  - information_object
  existential_dependencies:
  - Assertion needs the audit entry content and a denoted/reference Member target; actual causal participation
    in a real change is not required (po:c8e8fdebd997 and po:160303617dee). A dangling target would be
    unresolved reference data, not proof that the named human acted. The record can name a retained membership
    after active authorization ends.
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: unresolved
  terminal_states: []
counterexamples:
- description: A false or mistaken audit attribution still names a member. Equating the attribution with
    actual event participation would turn record content into proof and would confuse a Member reference
    with a human actor identity.
status: proposed
