revision_requests:
  - "Do not warrant grantedTo solely as semantic support for otp:Grant:001 while Grant is not a decision term. CQ-P11 is answered by naming the member who holds the role at a scope; it does not require a reified grant to be the subject of grantedTo."
  - "The shared role-assignment discriminator is true of member.role with no grant row (po:4ddf67948771, po:5c45964a11cc). Replace it with a fact that a member row's role field lacks, or drop the claim that the null is rejected."
attacks:
  - surface: warrant
    rule: supports-non-decision-term
    counterexample: "grantedTo's only warrant is semantic_support_for otp:Grant:001. CQ-P11 asks which member holds which role at which scope. Member M with role admin at the constant extent organization answers that without a Grant individual (po:c4054ec5a4fd, po:4ddf67948771). Support for a class the question does not require is not support for a decision term. po:5c45964a11cc (\"links a grant to the member who holds it\") presupposes the grant node; it does not show the natural-language question needs that node. There is no self-reference and no CQ id in semantic_support_for; the failure is the target."
    outcome: landed
  - surface: null_discriminator
    rule: discriminator-true-of-dto
    counterexample: "The joined hypothesis discriminator is the authorized member-role-extent assignment with no grant row. M.role already is that assignment under po:559ba5ec7c7d and po:4ddf67948771. The recipient is M. A derived <M>/role node plus an edge back to M adds no fact the member row lacked. The discriminator stays true of the implementation-only twin."
    outcome: landed
  - surface: identity
    rule: identifier-is-identity
    counterexample: "Viewer, then admin, then viewer on M share <M>/role. The proposal says no property individual is minted and that this address does not decide one assignment versus three. It does not assert the key as identity. The defect is the warrant and the discriminator, not a hidden property identity."
    outcome: survived
