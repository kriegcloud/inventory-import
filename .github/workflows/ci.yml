name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Through turbo: type-check, lint, fast and slow tests, the production build, format and docs checks.
      - name: Check, test and build
        run: bun run check:full -- --summarize
      # The data grid's typing, in a real browser: what is typed on a cell is what is stored. The runner image has
      # Chrome at this path (CHROME_BIN in actions/runner-images, Ubuntu 24.04). The browser says its version first,
      # so a path that is wrong fails on that line with the path in it.
      - name: Type on the data grid
        run: |
          "$CHROME_PATH" --version
          bun run --cwd apps/inventory grid:keys
        env:
          CHROME_PATH: /usr/bin/google-chrome
