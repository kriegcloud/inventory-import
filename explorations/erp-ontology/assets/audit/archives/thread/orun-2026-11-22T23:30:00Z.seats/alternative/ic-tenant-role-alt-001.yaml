      "description": "Succession: the Tenant role passes to a successor Organization that keeps the workspace (po:715824f4fc19). Every Membership 'in' the Tenant and every record 'inTenant' now relates to a different bearer although nothing in the workspace changed. Under a pure role model those memberships must either end (they mediated the old bearer) or silently re-target — evidence that membership and record scoping actually relate to the workspace/tenancy, not the role-bearer."
