proposed_referent:
  label: Audit entry recording a stated change
  description: 'Candidate referent: a written information record saying what was done, naming a member
    and carrying its writing time in a tenant. Activity is a supplied alternative name for this information
    object. An instance is one entry distinguished by tenant plus entry id; multiple entries may describe
    a change, and entry identity does not establish change or actor identity. Copied name, detail and
    agent strings do not establish separate domain entities.'
representation_status: information_artifact
alternatives:
- label: The actual change event or proof of the named member acting
  representation_status: domain_referent
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: Creation as an audit record about another occurrence and explicit limits on its evidential
    force support an information object. Same-batch writing is a quoted claim, not independently verified
    transactional behavior.
  discriminator: 'The quoted use case says data changes write Activity rows, and the explicit audit decision
    distinguishes what an entry says from who actually made a change: the entry cannot prove that actor.
    Thus the intended object is a persistent claim-bearing record read by people, not only a schema construct
    or the event itself.'
epistemic_status: proposed
confidence:
  value: 0.85
  use_for_acceptance: false
