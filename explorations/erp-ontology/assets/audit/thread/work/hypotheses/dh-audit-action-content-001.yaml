proposed_referent:
  label: Audit action wording
  description: 'Candidate referent: human-readable action content within an audit entry. Instances are
    wording occurrences attached to particular entries; equal strings in different entries need not be
    one occurrence or identify one change. The wording reports what was done without demonstrating the
    actual event.'
representation_status: information_artifact
alternatives:
- label: A completed business change event
  representation_status: domain_referent
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: The explicit aboutness and human-readable reporting role justify informational content; no
    independent taxonomy of action types is inferred.
  discriminator: The quoted audit decision asks what the entry says was done and explicitly distinguishes
    entry content from proof of a change actor. The action words therefore function as report content
    read by people, rather than being the executed act itself.
epistemic_status: proposed
confidence:
  value: 0.85
  use_for_acceptance: false
