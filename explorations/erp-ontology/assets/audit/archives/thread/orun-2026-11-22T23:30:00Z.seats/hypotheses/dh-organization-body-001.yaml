proposed_referent:
  label: Organized body
  description: 'Candidate referent: an organized body formed for a purpose. Grouped chains describe companies,
    counterparties and the tenant body, while distinguishing imported source records. An instance follows
    legal-entity continuity; an unregistered body is distinguished by its founding. A successor is another
    body even if it inherits the workspace.'
representation_status: domain_referent
alternatives:
- label: A tenant workspace or imported organization record
  representation_status: information_artifact
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: The organizational bearer has a supplied identity criterion independent of a software workspace.
    No source Organization declaration is required or invented.
  discriminator: The identity decision explicitly makes a successor company a new organization despite
    retention of the same workspace, and identifies unregistered bodies by their founding. Workspace or
    record continuity therefore cannot constitute the intended organization identity.
epistemic_status: proposed
