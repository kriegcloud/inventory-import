# Alternative-model seat (blinded): independent ruling from observations + hypotheses only.
id: "ic:grant-role-content-alt:001"
hypothesis_ref: "dh:grant-role-content:001"
identity:
  supplies_identity: false
  identity_criterion: "Individuated by the grant it inheres in: one access-level quality per grant, whose value is an entry of the access-level vocabulary."
  reidentification_key:
    - "grant -> Role literal"
ontoclean:
  rigidity: anti_rigid
  carries_identity: false
  supplies_identity: false
  unity: "non_unity (-U)"
  dependence: intrinsic
ufo_analysis:
  candidate_category: quality
  alternatives:
    - "none: an object property from grant to vocabulary entry"
    - "essential (identity-constituting) characteristic of the grant, if a level change creates a new grant"
  existential_dependencies:
    - "the grant"
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: true
  terminal_states: []
counterexamples:
  - description: "ChangeRole ('Give a member this role') suggests the level changes in place, so the grant persists across values (quality with changing value, anti-rigid on the grant). If instead each change revokes and re-founds a grant, the level is fixed for the grant's life and the quality is rigid for its bearer."
status: proposed
