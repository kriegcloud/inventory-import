proposed_referent:
  label: Person-to-tenant membership
  description: 'Candidate referent: a relationship letting one human act in one tenant workspace until
    removal. Grouped chains include the acting Member representation, removal and role-management use
    case, and the distinction between one human and two memberships. An instance is an established membership
    in one tenant, tracked by tenant plus MemberId retained after removal; re-creation and human resolution
    beyond that handle remain unproved.'
representation_status: domain_referent
alternatives:
- label: A member row or session actor snapshot alone
  representation_status: information_artifact
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: The relationship semantics, finite authorization interval and independent human bearer supply
    more than the presence of an id field. This does not prove production membership history.
  discriminator: The prose explicitly describes a relation that permits workspace action only from creation
    until removal, and the two-member/one-human example distinguishes membership identity from human identity.
    A display or session record alone has neither that interpersonal relation nor its stated duration
    of authorization.
epistemic_status: proposed
confidence:
  value: 0.85
  use_for_acceptance: false
