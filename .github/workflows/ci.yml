name: CI

on:
  push:
    # A release branch is checked as main is, and this check passing on a tagged head is what starts the release
    # (deploy.yml).
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

# A pull request's new push cancels its run in progress. A push to main or a release branch does not cancel the run in
# progress, though GitHub still keeps only the newest of the runs waiting in the group: the bans' ledgers are compared
# with the last push whose run passed, so a run skipped that way is checked by the next.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The check is three jobs that start at once, so a run lasts as long as its longest part and not as long as their
  # sum on one runner's four cores: the two longest tasks each have a runner (`web`, `slow`) and everything else
  # shares a third (`rest`). The job named "Check, test and build" below waits for the three and is the name the
  # rule on main requires (packages/infra/src/GitHub.stack.ts).
  rest:
    name: Check, test and build (all but the two longest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A push to main writes the shared cache, through the environment that alone holds the write token and that only
    # main may use; every other run only reads it. Named only once the repository's stack wrote the cache's settings,
    # so no run makes the environment before the stack does (packages/infra/src/TurboCache.rules.ts).
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TURBO_CACHE_API != '' && 'turbo-cache-write' || null }}
    # A job's permissions replace the workflow's: the bans' ledgers are compared, on a push, with the last commit of the
    # branch whose run passed, so this job alone reads the runs.
    permissions:
      contents: read
      actions: read
    steps:
      # The bans' ledgers may only fall, compared with where this commit left main (their merge base): the whole
      # history is fetched so git can find it (packages/tooling/tool/cli/ledgers).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # On a push, the ledgers are compared with the last commit pushed to this branch whose run passed, so a number
      # raised in a push whose run was cancelled, failed or skipped is seen all the same. Only push runs count: a
      # pull request's run reports its own head branch, which a fork may call main. Each candidate is taken only when
      # it is fetched, holds every ledger (and defaults' baseline) and HEAD holds it, so a force push, a commit only under refs/pull or one from
      # before the ledgers never stops every later run or weakens it: on main, the last passing push, then the push's
      # `before`; on a release branch, the last passing push. A candidate fetched but not in HEAD's history (a force
      # push) gives way to its merge base with HEAD, when that holds the ledgers. With none, no base is named and the
      # laws take their own default. A `gh` that fails (an outage, a rate limit) is warned about, not fatal.
      # The base is this step's output, never GITHUB_ENV: only the step that runs the laws below sees LEDGER_BASE. The
      # laws' own tests build repositories that do not hold the commit, and refused it when the whole job saw it.
      - name: Base of the bans' ledgers
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          passed=$(gh run list --workflow ci.yml --branch "$GITHUB_REF_NAME" --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty') || {
            echo "::warning::gh could not list this branch's passing runs, so the bans' ledgers fall back to the push's before or the law's own base"
            passed=
          }
          if [ "$GITHUB_REF_NAME" = main ]; then candidates="$passed $BEFORE"; else candidates="$passed"; fi
          # Every ledger HEAD keeps, and the defaults law's baseline: a base must hold them all.
          ledgers="$(git ls-tree --name-only HEAD packages/tooling/tool/cli/ledgers/) defaults-baseline.json"
          holds() {
            git cat-file -e "$1^{commit}" 2>/dev/null || return 1
            for ledger in $ledgers; do git cat-file -e "$1:$ledger" 2>/dev/null || return 1; done
          }
          for candidate in $candidates; do
            if holds "$candidate" && git merge-base --is-ancestor "$candidate" HEAD; then
              echo "ledger_base=$candidate" >> "$GITHUB_OUTPUT"
              echo "The bans' ledgers are compared with $candidate"
              exit 0
            fi
          done
          for candidate in $candidates; do
            if holds "$candidate"; then
              joined=$(git merge-base "$candidate" HEAD) || continue
              if holds "$joined"; then
                echo "ledger_base=$joined" >> "$GITHUB_OUTPUT"
                echo "The bans' ledgers are compared with $joined, where $candidate and this push meet"
                exit 0
              fi
            fi
          done
          echo "No candidate holds the ledgers: the law takes its own base (the merge base with main; on main, HEAD^1)"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The shared turbo cache (goals/ci-speed, step 9): beep-effect's Worker, team `inventory`. A push to main reads
      # and writes; a pull request and a release branch only read; a fork's run is given no token and keeps turbo's
      # local cache, as every run does until the repository's stack has written the settings.
      - name: The shared cache
        env:
          API: ${{ vars.TURBO_CACHE_API }}
          TEAM: ${{ vars.TURBO_CACHE_TEAM }}
          TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.TURBO_CACHE_WRITE_TOKEN || secrets.TURBO_CACHE_READ_TOKEN }}
          MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'local:rw,remote:rw' || 'local:rw,remote:r' }}
        run: |
          if [ -z "$API" ] || [ -z "$TEAM" ] || [ -z "$TOKEN" ]; then
            echo "No shared cache for this run: turbo keeps its local cache"
            exit 0
          fi
          { echo "TURBO_API=$API"; echo "TURBO_TEAM=$TEAM"; echo "TURBO_TOKEN=$TOKEN"; echo "TURBO_CACHE=$MODE"; } >> "$GITHUB_ENV"
          echo "The shared cache, team $TEAM: $MODE"
      # Through turbo: type-check, lint, the fast tests, the production build, format and docs checks and every law:
      # `check:ci`, without the package the `web` job checks. The slow tests are the `slow` job's, and the review
      # model's proofs, its search and its other long tests the `proofs` jobs'.
      # The runner has four cores. Turbo would start ten tasks at once and each test run a worker per core, which
      # made tests several times slower than they are and failed them on their limits; two tasks at a time with one
      # test worker each is what four cores carry (measured: docs/standards/engineering.md, "The check on CI").
      # `--continue` runs every task even after one fails, so a red run lists everything that is wrong.
      # A push to main runs every task again with `--force`, whatever the shared cache holds, and writes its results
      # over what was there: a result a pull request replayed from a workstation is made again on CI at the merge, so
      # a difference between the two turns main red (decision "what a shared cache asks", 1).
      # The longest properties run fewer times on a pull request (vitest.shared.ts; Benjamin's decision of
      # 2026-11-26), and only while no cache is shared. A push leaves the variable unset, as a workstation does: turbo
      # hashes unset apart from any value, and those two are the cache's only writers, so a pull request that set it
      # could replay no test. Once the cache exists a pull request leaves it unset too, and pays today's counts on
      # the tests it changed (Benjamin's decision of 2026-11-26, the second).
      - name: Fewer property runs on a pull request, while no cache is shared
        if: ${{ github.event_name == 'pull_request' && vars.TURBO_CACHE_API == '' }}
        run: echo "PROPERTY_RUNS=short" >> "$GITHUB_ENV"
      - name: Check, test and build
        run: bun run check:ci -- --filter='!@inventory/catalog-web' --summarize --continue --concurrency=2 ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--force' || '' }}
        env:
          VITEST_MAX_WORKERS: 1
      # The seven laws with a ledger, again, against the base the step above named: in the check above they compared
      # with their own default (where this commit left main; on main, the commit before), which misses a number raised
      # in an earlier push whose run did not pass. They take seconds. LEDGER_BASE is given to this step alone.
      - name: The bans' ledgers against the last passing push
        if: ${{ !cancelled() && steps.base.outputs.ledger_base != '' }}
        run: bunx turbo run //#promises:check //#diagnostics:check //#assertions:check //#dual:check //#readonly:check //#fast-refresh:check //#defaults:check --continue --concurrency=2
        env:
          LEDGER_BASE: ${{ steps.base.outputs.ledger_base }}
      # Turbo's own time for each task of this job (`--summarize` writes it), kept with the run: what a change to
      # the jobs is measured against (goals/ci-speed). The folder's name starts with a dot, which the action leaves
      # out unless told.
      - name: Keep turbo's times
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: turbo-runs-rest
          path: .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: warn

  # The catalog's screens: their fast tests are the longest task of the check (the import's draft held against a
  # model of it, over thousands of orderings), so the package has a runner to itself, with its type-check and lint.
  web:
    name: Check and test the catalog's screens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A push to main writes the shared cache, through the environment that alone holds the write token and that only
    # main may use; every other run only reads it. Named only once the repository's stack wrote the cache's settings,
    # so no run makes the environment before the stack does (packages/infra/src/TurboCache.rules.ts).
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TURBO_CACHE_API != '' && 'turbo-cache-write' || null }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The shared turbo cache (goals/ci-speed, step 9): beep-effect's Worker, team `inventory`. A push to main reads
      # and writes; a pull request and a release branch only read; a fork's run is given no token and keeps turbo's
      # local cache, as every run does until the repository's stack has written the settings.
      - name: The shared cache
        env:
          API: ${{ vars.TURBO_CACHE_API }}
          TEAM: ${{ vars.TURBO_CACHE_TEAM }}
          TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.TURBO_CACHE_WRITE_TOKEN || secrets.TURBO_CACHE_READ_TOKEN }}
          MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'local:rw,remote:rw' || 'local:rw,remote:r' }}
        run: |
          if [ -z "$API" ] || [ -z "$TEAM" ] || [ -z "$TOKEN" ]; then
            echo "No shared cache for this run: turbo keeps its local cache"
            exit 0
          fi
          { echo "TURBO_API=$API"; echo "TURBO_TEAM=$TEAM"; echo "TURBO_TOKEN=$TOKEN"; echo "TURBO_CACHE=$MODE"; } >> "$GITHUB_ENV"
          echo "The shared cache, team $TEAM: $MODE"
      # The longest properties run fewer times on a pull request (vitest.shared.ts; Benjamin's decision of
      # 2026-11-26), and only while no cache is shared. A push leaves the variable unset, as a workstation does: turbo
      # hashes unset apart from any value, and those two are the cache's only writers, so a pull request that set it
      # could replay no test. Once the cache exists a pull request leaves it unset too, and pays today's counts on
      # the tests it changed (Benjamin's decision of 2026-11-26, the second).
      - name: Fewer property runs on a pull request, while no cache is shared
        if: ${{ github.event_name == 'pull_request' && vars.TURBO_CACHE_API == '' }}
        run: echo "PROPERTY_RUNS=short" >> "$GITHUB_ENV"
      - name: Check, lint and test
        run: bunx turbo run check lint test --filter=@inventory/catalog-web --summarize --continue --concurrency=2 ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--force' || '' }}
        env:
          VITEST_MAX_WORKERS: 1
      # Turbo's own time for each task of this job (`--summarize` writes it), kept with the run: what a change to
      # the jobs is measured against (goals/ci-speed). The folder's name starts with a dot, which the action leaves
      # out unless told.
      - name: Keep turbo's times
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: turbo-runs-web
          path: .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: warn

  # The slow tests (workerd, a real D1 database, sign-in), which turbo replays until what they read changes; the one
  # test that calls a real service (`test:live`), which it never replays; and the data grid typed on in a real browser.
  slow:
    name: Slow tests and the data grid
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A push to main writes the shared cache, through the environment that alone holds the write token and that only
    # main may use; every other run only reads it. Named only once the repository's stack wrote the cache's settings,
    # so no run makes the environment before the stack does (packages/infra/src/TurboCache.rules.ts).
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TURBO_CACHE_API != '' && 'turbo-cache-write' || null }}
    steps:
      # The whole history, as these tests had it when they ran in the one check job.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The shared turbo cache (goals/ci-speed, step 9): beep-effect's Worker, team `inventory`. A push to main reads
      # and writes; a pull request and a release branch only read; a fork's run is given no token and keeps turbo's
      # local cache, as every run does until the repository's stack has written the settings.
      - name: The shared cache
        env:
          API: ${{ vars.TURBO_CACHE_API }}
          TEAM: ${{ vars.TURBO_CACHE_TEAM }}
          TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.TURBO_CACHE_WRITE_TOKEN || secrets.TURBO_CACHE_READ_TOKEN }}
          MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'local:rw,remote:rw' || 'local:rw,remote:r' }}
        run: |
          if [ -z "$API" ] || [ -z "$TEAM" ] || [ -z "$TOKEN" ]; then
            echo "No shared cache for this run: turbo keeps its local cache"
            exit 0
          fi
          { echo "TURBO_API=$API"; echo "TURBO_TEAM=$TEAM"; echo "TURBO_TOKEN=$TOKEN"; echo "TURBO_CACHE=$MODE"; } >> "$GITHUB_ENV"
          echo "The shared cache, team $TEAM: $MODE"
      - name: The slow tests and the live one
        run: bunx turbo run test:slow test:live --summarize --continue --concurrency=2 ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--force' || '' }}
        env:
          VITEST_MAX_WORKERS: 1
      # The data grid's typing, in a real browser: what is typed on a cell is what is stored. The runner image has
      # Chrome at this path (CHROME_BIN in actions/runner-images; the runs are on Ubuntu 26.04, whose image lists
      # Google Chrome as 24.04's does). The browser says its version first,
      # so a path that is wrong fails on that line with the path in it.
      # It runs when the slow tests failed as well, so a red run says whether the grid still stores what is typed; the
      # job still fails on their failure. Not on a cancelled run.
      - name: Type on the data grid
        if: ${{ !cancelled() }}
        run: |
          "$CHROME_PATH" --version
          bun run --cwd apps/inventory grid:keys
        env:
          CHROME_PATH: /usr/bin/google-chrome
      # Turbo's own time for each task of this job (`--summarize` writes it), kept with the run: what a change to
      # the jobs is measured against (goals/ci-speed). The folder's name starts with a dot, which the action leaves
      # out unless told.
      - name: Keep turbo's times
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: turbo-runs-slow
          path: .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: warn

  # The name the rule on main requires. It runs whatever became of the three, and is red unless each passed: a job
  # that is skipped counts as passed for a required check, so this one is never skipped.
  check:
    name: Check, test and build
    if: ${{ always() }}
    needs: [rest, web, slow]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "rest, web, slow: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done

  # The models, apart from the jobs above: the review's model and the usage model each with its proofs, its search
  # and a sample of its mutants (`mutants:sample` in packages/catalog/model and packages/usage/model), and the property
  # that holds the review's model against the review region (`fold`). Each is a turbo task that names what it reads: the
  # proofs, the search and the mutants rerun when the model's files, its stories or proofs, the mutants, the kernel,
  # the pinned library or a version the lockfile resolves for the package change; the fold reruns on any change to
  # the web package or what it imports. The three long ones start at once, a runner each: the proofs, the search,
  # and the fold beside the mutants. Their results are in the shared cache with everything else, written by main's
  # pushes and the workstation, so a pull request that leaves those files alone, or whose commit passed them
  # locally, replays them in seconds. The search is the exception: its hash holds `CI` (under CI it writes no lock),
  # so it replays what a push to main wrote and never a workstation's run without `CI=true`. Main does not force
  # them: every night they run again with nothing replayed and every mutant (proofs-nightly.yml).
  model:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A push to main writes the shared cache, through the environment that alone holds the write token and that only
    # main may use; every other run only reads it. Named only once the repository's stack wrote the cache's settings,
    # so no run makes the environment before the stack does (packages/infra/src/TurboCache.rules.ts).
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TURBO_CACHE_API != '' && 'turbo-cache-write' || null }}
    strategy:
      # One part failing does not stop the others: a red run says everything that is wrong.
      fail-fast: false
      matrix:
        include:
          - part: prove
            name: The model's proofs
            tasks: prove
          - part: verify
            name: The search of the model
            tasks: verify
          - part: fold
            name: The model against the review region, and a sample of its mutants
            tasks: fold mutants:sample
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The shared turbo cache (goals/ci-speed, step 9): beep-effect's Worker, team `inventory`. A push to main reads
      # and writes; a pull request and a release branch only read; a fork's run is given no token and keeps turbo's
      # local cache, as every run does until the repository's stack has written the settings.
      - name: The shared cache
        env:
          API: ${{ vars.TURBO_CACHE_API }}
          TEAM: ${{ vars.TURBO_CACHE_TEAM }}
          TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.TURBO_CACHE_WRITE_TOKEN || secrets.TURBO_CACHE_READ_TOKEN }}
          MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'local:rw,remote:rw' || 'local:rw,remote:r' }}
        run: |
          if [ -z "$API" ] || [ -z "$TEAM" ] || [ -z "$TOKEN" ]; then
            echo "No shared cache for this run: turbo keeps its local cache"
            exit 0
          fi
          { echo "TURBO_API=$API"; echo "TURBO_TEAM=$TEAM"; echo "TURBO_TOKEN=$TOKEN"; echo "TURBO_CACHE=$MODE"; } >> "$GITHUB_ENV"
          echo "The shared cache, team $TEAM: $MODE"
      # Two tasks at a time and no more: the runner has four cores and each proof file starts its own solver.
      - name: Run this part
        run: bunx turbo run ${{ matrix.tasks }} --concurrency=2 --summarize
      # Turbo's own time for each task of this job (`--summarize` writes it), kept with the run: what a change to
      # the jobs is measured against (goals/ci-speed). The folder's name starts with a dot, which the action leaves
      # out unless told.
      - name: Keep turbo's times
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: turbo-runs-${{ matrix.part }}
          path: .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: warn

  # The name the rule on main requires, as `check` above is for its three.
  proofs:
    name: Proofs and search of the model
    if: ${{ always() }}
    needs: [model]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.model.result }}
        run: |
          echo "prove, verify, fold with the mutants: $RESULT"
          [ "$RESULT" = success ]

  # Gate 9 of the ERP vocabulary, apart from the jobs above (explorations/erp-ontology/DECISIONS.md, decision 114): a
  # reasoner reads the generated ontology with the thread's data and with each refused case, so a change that lets a
  # person be a tenant, or an audit entry be who it is about, fails its pull request. `check:ci` does not run it: it
  # needs Java and a jar no install brings. The pin of both is one file, packages/ontology/robot.lock.json, and every
  # value below is read from it. What is cached is the jar, never a result: the script starts on every run, and the
  # `reason` task is never replayed by turbo (packages/ontology/turbo.json).
  reason:
    name: The reasoner on the vocabulary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The script keeps the jar under $XDG_CACHE_HOME/inventory-import/robot/<release>/, so the folder is named here
      # once, for the script and for the cache alike.
      - name: Read the pin
        id: pin
        run: |
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/cache" >> "$GITHUB_ENV"
          node -e '
            const pin = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))
            for (const key of ["release", "sha256", "javaMajor"]) {
              if (!/^[A-Za-z0-9.]+$/.test(String(pin[key]))) throw new Error("robot.lock.json has no plain " + key)
            }
            console.log("java=" + pin.javaMajor)
            console.log("sha256=" + pin.sha256)
            console.log("folder=" + process.argv[2] + "/cache/inventory-import/robot/" + pin.release)
          ' packages/ontology/robot.lock.json "$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
      # The script takes the Java at JAVA_HOME first, and refuses one whose major version is not the pin's.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.pin.outputs.java }}
      # Keyed by the jar's sha256 alone: another jar is another key. With none kept, the script fetches the pinned
      # address itself.
      - name: Bring back the jar
        id: jar
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pin.outputs.folder }}
          key: robot-jar-${{ steps.pin.outputs.sha256 }}
      # The script hashes the jar on every run, fetched or brought back, and refuses one that is not the pin's; then
      # the two runs that must be consistent and the three that must not. One task: nothing else of the check runs.
      - name: Gate 9, the reasoner
        run: bunx turbo run reason --filter=@inventory/ontology
      # Only after the gate passed, so only a jar the script hashed to the pin is ever kept.
      - name: Keep the jar for later runs
        if: steps.jar.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.pin.outputs.folder }}
          key: robot-jar-${{ steps.pin.outputs.sha256 }}
