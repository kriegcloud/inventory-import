alternatives_rejected:
- 'Foundational analysis rejects: Rigid subkind of Organization.'
- 'Implementation-only null rejected on the supplied discriminator, not merely on the existence of a field:
  The supplied tenancy isolation account motivates a workspace role of an organizational bearer, while the
  succession decision separates bearer identity from database addressing.'
open_issues:
- 'FLAGGED FOR STEWARD — foundational_status explicitly_deferred; this proposal does not settle the foundational
  question. Needed evidence: Resolve the Organization identity continuity questions, then supply a dated workspace-to-body
  succession example showing which body bears Tenant before and after takeover; this is needed for bearer identity,
  not for the anti-rigid role classification.'
- Identity is inherited from the organizational bearer, not supplied by OrganizationId. Succession to a new
  legal body changes the bearer despite the same workspace. Workspace retention does not fuse successive bodies.
  Organization continuity and dated role succession remain unresolved.
- 'STEWARD CHOICE REQUIRED — this is one provisional term shape, not a merged or chosen rival model. Choose
  explicitly among: Workspace partition as a separately identifiable information/system object. This synthesis
  makes no selection by omission. The selected model may require a revised proposal or a separate future candidate;
  no such additional term is admitted in this 18-key scope.'
- 'Strongest counterexample carried forward: A successor keeps the same OrganizationId and workspace, but is
  a new organization. Treating Tenant identity as the partition key would falsely identify distinct role bearers.'
- 'Identity-card alternatives carried forward: Workspace partition is a distinct referent rather than an equivalent
  interpretation of the body in its role.'
- 'Existential dependencies carried forward: Depends on the body standing in the relation for which the application
  keeps a workspace and isolates records (po:e93ff65f63c8); the body can persist after ceasing to be Tenant.
  The workspace can persist while a successor body assumes Tenant. Tenant is not the workspace itself.'
- 'Reuse search scope: the supplied gist 14.1.0 projection and thin-thread design only; no separate reuse dispositions
  or external search results were supplied. No exact local-term replacement was established within this bounded
  search.'
- 'Evidence boundary: the hypothesis discriminator is a supplied prose/design assertion, not a live test. Quoted
  discriminator from dh:tenant-role:001: “The prose distinguishes the legal body from the retained workspace
  and says the Tenant role passes to a successor organization. A role borne by distinct legal bodies across
  succession cannot be identical to an unchanged partition key alone.” The claim must fail for a pure data-transfer
  twin: the role changes legal bearer across succession despite the unchanged partition.'
- Parent withheld pending identity and rival-model resolution. The proposed thin-thread parent is a candidate
  only; no ancestor identity supplier has been established for this unresolved branch.
