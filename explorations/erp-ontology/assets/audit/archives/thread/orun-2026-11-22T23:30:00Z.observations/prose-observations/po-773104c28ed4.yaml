quote: "The auditor's adversary failed Grant, `grantedTo`, `grantsRole`, `grantScope`, `GrantScopeKindScheme` and Organization because CQ-P06 can be answered with a role written on the member. I chose to add one competency question that cannot be answered without a grant: at which scope does each member hold which role. Decision 40 stands. The agent recommended the same."
