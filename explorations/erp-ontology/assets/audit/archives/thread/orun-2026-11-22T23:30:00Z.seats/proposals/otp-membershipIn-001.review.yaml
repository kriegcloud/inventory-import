no_surface_reasons:
  taxonomy: "parents is empty. No is-a edge is proposed for this object property, so superclass rigidity, identity, unity, and dependence checks have no edge to apply to."
revision_requests:
  - "The Member warrant can stay: CQ-P06 needs the tenant end of a membership. The null discriminator cannot. po:8b535e25c8a2 and the Member row's organizationId (so:ef1f0d4ea98a) already state which workspace the authorization is in. Cite a fact that column lacks, or do not claim the implementation-only null is rejected."
attacks:
  - surface: null_discriminator
    rule: discriminator-true-of-dto
    counterexample: "Member row M carries organizationId T and is the authorization po:8b535e25c8a2 limits to the interval from creation until removal. The joined discriminator says a display or session record has neither that relation nor that interval. M is the member row, which is the implementation artifact, and organizationId is already the tenant end. An object property membershipIn to a Tenant node restates the column. The discriminator stays true of the row."
    outcome: landed
  - surface: warrant
    rule: support-not-necessary
    counterexample: "membershipIn is semantic support for otp:Member:001, a decision term for CQ-P06 (\"members of this organization\"). Two memberships of one human in two tenants are not distinguished by the human or by an unscoped role. The tenant end is necessary for that decision term. This attack does not land. The failure is the discriminator inherited from dh:workspace-membership:001."
    outcome: survived
  - surface: identity
    rule: identifier-is-identity
    counterexample: "Remove M and later recreate access for the same human in T, reusing MemberId. The proposal mints no property individual and says the retained handle does not prove one continuing membership. Relational equality of endpoints is not asserted as a sortal criterion for a new relator."
    outcome: survived
