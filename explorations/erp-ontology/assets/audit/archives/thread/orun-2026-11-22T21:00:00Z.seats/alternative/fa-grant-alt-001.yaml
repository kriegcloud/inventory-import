# Alternative-model seat (blinded): independent ruling from observations + hypotheses only.
id: "fa:grant-alt:001"
hypothesis_ref: "dh:grant:001"
identity_card_ref: "ic:grant-alt:001"
tests:
  spec_vs_execution: separated
  world_vs_information: separated
  role_vs_bearer: separated
  context_reification_needed: true
rival_models:
  - label: "Grant as relator founded by a granting event, with level and extent as its qualities (this seat)"
    still_viable: true
  - label: "Grant as the granting event itself"
    still_viable: false
  - label: "Level as a quality of the membership; no grant individual (implementation-shaped model)"
    still_viable: true
strongest_counterexample: "Two grants to the same member, both 'editor', both scope kind 'location' but different locations: with only scope kind linked (grant-scope-content) they are indistinguishable by tuple, so either the scope target is a further participant (n-ary grant) or the two collapse."
verdict: analyzed
needed_evidence: "(1) Can one member hold several grants simultaneously at different scopes? (2) Does ChangeRole mutate an existing grant or replace it? (3) Is the granter recorded? Each answer discriminates relator vs membership-quality and quality-change vs new-grant."
