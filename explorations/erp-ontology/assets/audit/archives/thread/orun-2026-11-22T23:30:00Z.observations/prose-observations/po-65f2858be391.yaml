quote: "A question the second review raised under decision 22: the `Activity` record's fields had no properties in the thread. I chose four: `recordedActor` (to the `Member`), `action`, `recordedAt` and `inTenant`. The copied actor name and the detail sentence are `noTerm`, reason screen. The agent field waits for `AgentRun` in the party slice and is marked `noTerm` with a sixth reason, deferred, which names the slice that will place it; this adds one value to decision 21's closed list. The agent recommended the same."
