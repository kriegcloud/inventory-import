alternatives_rejected:
- 'Implementation-only null rejected on the supplied discriminator, not merely on the existence of a field:
  The scope-sensitive access decision supplies a referent beyond the derived node syntax. The member-and-field
  construction is only the supplied thin-thread individuation convention, not evidence of separate grant occurrences
  or a stored lifecycle.'
open_issues:
- 'FLAGGED FOR STEWARD — foundational_status explicitly_deferred; this proposal does not settle the foundational
  question. Needed evidence: Provide authorized assignment/revocation history with effective intervals and
  a steward decision on whether changing role or scope preserves assignment identity. Include repeated equal
  assignments and later return to the prior value; distinguish relation, establishing act and lifted representation.'
- 'Steward thin-thread identity convention: the recipient member and source record field role, represented
  as <member IRI>/role. There is no grant row or grant id. This is the one projection criterion, not a second
  domain identity criterion. Changes viewer→admin→viewer, scope edits, repeated equal assignments, revocation/re-adding
  and copied member records do not yet decide whether the same authorization assignment continues; domain identity
  remains unresolved.'
- 'STEWARD CHOICE REQUIRED — this is one provisional term shape, not a merged or chosen rival model. Choose
  explicitly among: Continuing authorization relator whose level may change; Distinct grant episodes each created
  by an assignment act; Current contextual role assertion without separately persisting grant individual. This
  synthesis makes no selection by omission. The selected model may require a revised proposal or a separate
  future candidate; no such additional term is admitted in this 18-key scope.'
- 'Strongest counterexample carried forward: At successive times member.role is viewer, admin, viewer; the
  same lifted IRI names every snapshot. That invariant node address cannot establish one continuing grant,
  and duplicate assignments with identical endpoints could still be distinct episodes.'
- 'Identity-card alternatives carried forward: situation; Unreified contextual member-role-scope relation'
- 'Existential dependencies carried forward: Active assignment jointly depends on recipient membership, access-level
  concept and applicable tenant/scope context (po:559ba5ec7c7d, po:c4054ec5a4fd). Authorized assigner is an
  establishment condition; no evidence requires its continued existence. No grant row, grant id or historical
  lifecycle is established (po:4ddf67948771).'
- 'Reuse search scope: the supplied gist 14.1.0 projection and thin-thread design only; no separate reuse dispositions
  or external search results were supplied. No exact local-term replacement was established within this bounded
  search.'
- 'Evidence boundary: the hypothesis discriminator is a supplied prose/design assertion, not a live test. Quoted
  discriminator from dh:role-assignment:001: “The prose describes an authorized assignment that jointly determines
  which member holds which role at which extent, and explicitly distinguishes organization-wide from narrower
  access for the action-offering decision. That contextual access assignment is the intended relationship even
  though no grant row exists.” The claim must fail for a pure data-transfer twin: an authorized, scope-sensitive
  assignment controls where actions may be offered or refused; a node address alone cannot establish that assignment.'
- Parent withheld pending identity and rival-model resolution. The proposed thin-thread parent is a candidate
  only; no ancestor identity supplier has been established for this unresolved branch.
- 'Warrant necessity: CQ-P11 requires connecting recipient, assigned access level and applicable extent. CQ-P06
  alone could put a role directly on a membership and is not used to warrant Grant. The viable unreified contextual
  relation remains an explicit steward choice.'
