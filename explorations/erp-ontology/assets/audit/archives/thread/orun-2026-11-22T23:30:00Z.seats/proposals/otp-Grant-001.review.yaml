revision_requests:
  - "Stop citing CQ-P11 as a warrant for a Grant class. The natural-language question asks at which scope each member holds which role. An unreified member-role-scope assertion answers it, and that rival is still viable. Either have the steward retire that rival, or warrant only the relation the question needs."
  - "Replace the null discriminator. po:c4054ec5a4fd and po:4ddf67948771 already read member.role as one organization-scoped grant and state that no grant row exists. A member row plus that constant makes the quoted assignment prose true. Cite a fact that arrangement lacks."
  - "Do not propose Grant as a rigid relator until some ancestor, itself included, supplies identity. The lifted IRI <member IRI>/role does not decide viewer, then admin, then viewer."
attacks:
  - surface: warrant
    rule: cq-does-not-require-term
    counterexample: "Member M has role admin and the thread's only extent is organization. CQ-P11 asks at which scope M holds which role. The answer (admin, organization) is fixed by po:c4054ec5a4fd without a Grant individual. CQ-P11's must_fail and SPARQL mention Grant because the drafted graph stores scope on a grant node; po:773104c28ed4 says CQ-P06 was already answerable from the member's role, and the new question still does not require reification once scope is a constant or a triple on M. The viable unreified rival answers the same natural-language question. A SPARQL listing is not a requirement."
    outcome: landed
  - surface: null_discriminator
    rule: discriminator-true-of-dto
    counterexample: "M.role is admin. po:559ba5ec7c7d calls that an assignment of one role to one member at one scope, made by someone allowed to assign it, and po:4ddf67948771 says there is no grant row: the node IRI is manufactured as <member IRI>/role. That derived node is the implementation artifact named in the hypothesis alternative, and the discriminator's \"even though no grant row exists\" is true of it. Organization-wide versus a narrower extent is a constant (organization) on the same node, not a fact the node lacks."
    outcome: landed
  - surface: identity
    rule: sortal-no-identity-ancestor
    counterexample: "At t1, t2, and t3, M.role is viewer, then admin, then viewer. All three snapshots share the IRI <M>/role (po:4ddf67948771, po:a189eb95f95d). No parent supplies identity, and the card's supplies_identity is unresolved, so nothing decides one continuing relator versus three episodes. Proposing a rigid unity relator in that state is a sortal with no identity-supplying ancestor, itself included. The IRI is a projection address, which the card already refuses as the criterion."
    outcome: landed
  - surface: identity
    rule: identifier-is-identity
    counterexample: "The proposal's closed identity value is unresolved and the text says the member-plus-role-field convention is only the lifted projection. It does not assert that technical key as domain identity. The sortal defect is the admission of the class, not a hidden key-as-identity claim."
    outcome: survived
