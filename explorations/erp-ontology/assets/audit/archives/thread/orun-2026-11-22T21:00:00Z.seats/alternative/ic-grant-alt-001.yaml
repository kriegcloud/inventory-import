# Alternative-model seat (blinded): independent ruling from observations + hypotheses only.
id: "ic:grant-alt:001"
hypothesis_ref: "dh:grant:001"
identity:
  supplies_identity: true
  identity_criterion: "Proposed (unratified): a grant is the same grant iff it has the same founding granting act; it persists while the recipient holds that access. Recipient-role-scope tuples are reidentification evidence only. Unresolved for Benjamin: does changing the role on an existing grant keep the grant (quality change) or end it and found a new one?"
  reidentification_key:
    - "(tenant, recipient MemberId, scope kind, scope target)"
    - "source has no Grant id observed; ChangeRole is addressed by memberId"
ontoclean:
  rigidity: rigid
  carries_identity: true
  supplies_identity: true
  unity: "unity (+U): one relator unifying recipient, granter, level and extent"
  dependence: relational
ufo_analysis:
  candidate_category: relator
  alternatives:
    - "event: the assigning act ('made by a member allowed to make it'); this seat treats it as the grant's founding event, not the grant"
    - "mode/quality of the membership (one level per membership, no separate grant), which is what the current source shape suggests"
  existential_dependencies:
    - "the recipient member (membership or human qua member)"
    - "the granting member and that member's own authority (an admin grant)"
    - "the tenant organization"
    - "the access-level vocabulary and the scope vocabulary"
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: true
  terminal_states:
    - "revoked"
    - "ended by removal of the recipient's membership"
counterexamples:
  - description: "The source shows one role per member per organization (Member.role, Person.role, ChangeRole 'Give a member this role'): no grant identity, no scope target. If that is the implementation, the grant relator collapses into a quality of the membership and the 'one role at one scope' prose has no instances."
  - description: "The hypothesis' 'assignment episode with ... assigning act' merges the founding act (event) with the standing assignment (relator)."
status: proposed
