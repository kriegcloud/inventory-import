alternatives_rejected:
- 'Foundational analysis rejects: Workspace partition or imported SourceRecord as the body itself.'
- 'Implementation-only null rejected on the supplied discriminator, not merely on the existence of a field:
  The organizational bearer has a supplied identity criterion independent of a software workspace. No source
  Organization declaration is required or invented.'
open_issues:
- 'FLAGGED FOR STEWARD — foundational_status explicitly_deferred; this proposal does not settle the foundational
  question. Needed evidence: A steward-approved continuity rule with merger, dissolution, reorganization and
  unregistered-body examples must distinguish continuation from successor formation and say whether member/purpose
  replacement preserves identity. Also identify the essential institutional dependencies. Kind is a candidate,
  not a settled identity-supplying sortal.'
- 'Steward identity commitment, as reported by the hypothesis and identity card: continuity of the organized
  legal body; a successor is a different body even when it retains the workspace; an unregistered body is distinguished
  by founding. Names, records and OrganizationId never supply body identity. Reorganization, merger, dissolution
  and replacement of founders or purpose remain unresolved. Kind is a candidate only: the unsettled card does
  not license an identity-supplying kind commitment.'
- 'STEWARD CHOICE REQUIRED — this is one provisional term shape, not a merged or chosen rival model. Choose
  explicitly among: Organizational collective with membership-based unity; Institutional organized body with
  legally constituted continuity and varying members. This synthesis makes no selection by omission. The selected
  model may require a revised proposal or a separate future candidate; no such additional term is admitted
  in this 18-key scope.'
- 'Strongest counterexample carried forward: An unregistered body replaces every founder and changes its purpose,
  or a company reorganizes without a legally new entity. Founding and the phrase same legal entity alone do
  not decide all such cases; retaining the workspace never establishes identity.'
- 'Identity-card alternatives carried forward: collective; Institutional body interpretation remains viable;
  member aggregation alone is not established.'
- 'Existential dependencies carried forward: Formation for a purpose and organization of people or other bodies
  are constitutive features (po:a9f7e334db4f). No particular workspace or tenant relation is necessary. Whether
  any particular constituent, purpose, registration or institutional recognition is essential is unresolved;
  founding is an origin condition, not dependence on a currently existing founder.'
- 'Reuse search scope: the supplied gist 14.1.0 projection and thin-thread design only; no separate reuse dispositions
  or external search results were supplied. No exact local-term replacement was established within this bounded
  search.'
- 'Evidence boundary: the hypothesis discriminator is a supplied prose/design assertion, not a live test. Quoted
  discriminator from dh:organization-body:001: “The identity decision explicitly makes a successor company
  a new organization despite retention of the same workspace, and identifies unregistered bodies by their founding.
  Workspace or record continuity therefore cannot constitute the intended organization identity.” The claim
  must fail for a pure data-transfer twin: a successor is a different body despite the same workspace; pure
  workspace-key continuity cannot satisfy that lifecycle.'
- 'Parent withheld: gist:Organization is a plausible organized-body parent, but no settled identity supplier
  in this branch is established. Do not assert the candidate kind while either provider is unresolved.'
