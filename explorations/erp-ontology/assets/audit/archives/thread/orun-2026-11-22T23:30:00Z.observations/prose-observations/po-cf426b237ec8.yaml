quote: "I chose both as one thing: viewer, editor and admin are concepts of `MemberRoleScheme`, and each is, under the same IRI, an individual of `Role`. Such an individual has one identity criterion, the concept's: its scheme and its notation. A tenant's custom role is another individual. The thin thread ships `Role` without `permits`, so `Permission` waits for the party slice. The agent recommended the same."
