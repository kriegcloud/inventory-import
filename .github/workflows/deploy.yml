name: Deploy

# Trunk, with release branches and tags (decisions "releases and deploys", docs/releasing.md):
# - a preview for each pull request, destroyed when it closes;
# - staging after a push to main whose CI run passed, while that commit is still main's head;
# - production after CI passed on a push to release/<major>.<minor>, only when that branch's head commit carries its
#   release tag, v<major>.<minor>.<patch>, and only after the approval the `production` environment asks for. A tag
#   pushed alone starts nothing, and nothing deploys production from main.
#
# Staging and production start from CI's completed run (`workflow_run`). GitHub runs such a workflow from the default
# branch: this file as it is on main, with main as its ref. So a release branch brings neither this file nor the
# guard that judges it, and the `production` environment, which only main may deploy to, refuses a run started from
# any other ref. Not verified on GitHub: it rests on GitHub's documented behaviour, and the first real release is
# where it is seen.
#
# The environments, their secrets and variables are made by the repository's stack (packages/infra/src/GitHub.stack.ts),
# deployed from a workstation. No job in this file destroys any stage but `pr-<number>`, and none deploys the
# repository's stack. That is true of this file, and GitHub runs a pull request with the pull request's own copy of
# it: the previews' token, which such a run holds, can change every stage on the previews' account, staging among
# them (docs/releasing.md, "Staging").

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, "release/**"]

permissions:
  contents: read

# Each job that deploys waits in a group of its own, never the workflow as a whole: a run in which every job is skipped
# then waits in no group, and cannot take the place of a deploy that was waiting its turn. GitHub keeps one waiting run
# for each group and cancels the one before it, so a group is as narrow as what must not run twice at once.

jobs:
  preview:
    name: Preview
    # A pull request from a fork gets no secret, so it gets no preview.
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    concurrency:
      group: deploy-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # The one password every preview's test accounts take. A secret: never echoed, and the stack never prints it.
      PREVIEW_TEST_ACCOUNT_PASSWORD: ${{ secrets.PREVIEW_TEST_ACCOUNT_PASSWORD }}
      # The emails that may open a preview, behind Cloudflare Access: the preview environment's secret, set by hand.
      # A secret, not a variable: this repository's logs are public. Without it the preview's deploy stops.
      PREVIEW_ACCESS: ${{ secrets.PREVIEW_ACCESS }}
      STAGE: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # What the deploy below will do, shown before it does it: the tool's `plan` and `deploy --dry-run` are one code
      # path, and `--yes` lets this step bring the state store up to date as the deploy itself would, where `plan`
      # would stop the job. One line for each resource and what happens to it, never `--detailed`: this log is public.
      # The guard after it reads that text and refuses a plan that deletes or replaces the database, and one it
      # cannot read (docs/operations.md).
      - name: Show the plan
        run: |
          bunx alchemy deploy --stage "$STAGE" --dry-run --yes > "$RUNNER_TEMP/plan.txt" 2>&1 && said=0 || said=$?
          cat "$RUNNER_TEMP/plan.txt"
          exit "$said"
      - name: Stop a plan that loses the database
        run: bun run beep infra plan-check "$RUNNER_TEMP/plan.txt"
      - name: Deploy the preview
        run: bunx alchemy deploy --stage "$STAGE" --yes

  cleanup:
    name: Remove the preview
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    # The same group as the preview's deploy: its removal waits for a deploy of it that is still running.
    concurrency:
      group: deploy-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      STAGE: pr-${{ github.event.pull_request.number }}
    steps:
      # The one destroy in any workflow. It refuses every name but pr-<number>, so production's database and a
      # person's test stage are out of its reach whatever the event says.
      - name: Refuse any stage but a preview
        run: |
          case "$STAGE" in
            pr-[1-9]|pr-[1-9][0-9]|pr-[1-9][0-9][0-9]|pr-[1-9][0-9][0-9][0-9]|pr-[1-9][0-9][0-9][0-9][0-9]|pr-[1-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *) echo "Refusing to destroy \"$STAGE\": only pr-<number> may be destroyed by a workflow." >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Destroy the preview
        run: bunx alchemy destroy --stage "$STAGE" --yes

  staging:
    name: Staging
    # After CI passed on a push to main, in this repository: main's head, deployed as it was checked. The trigger's
    # `branches: [main]` reads only the branch's name, so a pull request from a fork's own `main` starts this workflow
    # too; this condition is what keeps it out.
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    # A group of its own only for a run that deploys: any other run of this workflow gets a group nobody shares, so
    # it cannot cancel a staging deploy that is waiting, whether or not GitHub reads a skipped job's group.
    concurrency:
      group: >-
        ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) && 'deploy-staging' ||
        format('deploy-nothing-{0}', github.run_id) }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Staging's test accounts take the password every preview's do. A secret: never echoed.
      PREVIEW_TEST_ACCOUNT_PASSWORD: ${{ secrets.PREVIEW_TEST_ACCOUNT_PASSWORD }}
      # The emails that may make a real account on staging, from the staging environment's secret; unset, none. A
      # secret, not a variable: this repository's logs are public, and a variable's value is printed in them.
      SIGN_UP: ${{ secrets.SIGN_UP }}
      # Where Cloudflare's own traces and logs of the Worker are sent: a collector's https address (a variable) and
      # the authorization header it asks for (a secret). Both unset, the stack declares no destination.
      TELEMETRY_COLLECTOR_URL: ${{ vars.TELEMETRY_COLLECTOR_URL }}
      TELEMETRY_COLLECTOR_AUTHORIZATION: ${{ secrets.TELEMETRY_COLLECTOR_AUTHORIZATION }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI checked, not whatever main holds by now.
          ref: ${{ github.event.workflow_run.head_sha }}
      # Staging never goes backwards: a CI run that is run again for an older commit, or one that finishes after a
      # newer commit's, deploys nothing. Only the commit main is at now deploys; an older one's turn has passed, and
      # main's own CI run deploys main. When git cannot say where main is, the job fails. `git ls-remote` lists every
      # ref whose name ends as the one asked for, so only the line whose name is exactly main's is read.
      - name: Deploy only the commit main is at
        id: head
        env:
          CHECKED: ${{ github.event.workflow_run.head_sha }}
        run: |
          main="$(git ls-remote origin refs/heads/main | awk '$2 == "refs/heads/main" { print $1 }')"
          if [ -z "$main" ]; then
            echo "git could not say where main is, so nothing is deployed." >&2
            exit 1
          fi
          if [ "$main" = "$CHECKED" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not deploying $CHECKED: main is at $main now, and that commit's own CI run deploys staging."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.head.outputs.deploy == 'true'
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@v2
        if: steps.head.outputs.deploy == 'true'
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
        if: steps.head.outputs.deploy == 'true'
      # The plan, then the guard on it, as in the preview's job.
      - name: Show the plan
        if: steps.head.outputs.deploy == 'true'
        run: |
          bunx alchemy deploy --stage staging --dry-run --yes > "$RUNNER_TEMP/plan.txt" 2>&1 && said=0 || said=$?
          cat "$RUNNER_TEMP/plan.txt"
          exit "$said"
      - name: Stop a plan that loses the database
        if: steps.head.outputs.deploy == 'true'
        run: bun run beep infra plan-check "$RUNNER_TEMP/plan.txt"
      - name: Deploy staging
        if: steps.head.outputs.deploy == 'true'
        run: bunx alchemy deploy --stage staging --yes

  release-tag:
    name: Check the release
    # After CI passed on a push to a release branch, in this repository. The trigger's `branches` reads only the
    # branch's name, so a fork's own `release/1.0` starts this workflow too; this condition keeps it out.
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'release/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # The tag that may deploy; empty when the branch's head carries none, and then production is skipped.
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      # Main's code, with every branch: the guard that runs is main's, and it looks for the release's commits on the
      # release branch and on main.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      # A checkout can hold an annotated tag as a lightweight one; this takes every tag object as it was pushed.
      - name: Fetch the tags as pushed
        run: git fetch --force --tags origin
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The branch's name and the commit are passed as values, never written into the command: a branch may be named
      # anything.
      - name: Refuse a release that is not one
        id: verify
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          CHECKED: ${{ github.event.workflow_run.head_sha }}
        run: bun run beep release verify-head "$BRANCH" "$CHECKED" --output "$GITHUB_OUTPUT"

  production:
    name: Production
    needs: release-tag
    # Only when the guard named a tag: a release branch's head with no tag deploys nothing and asks nobody.
    if: needs.release-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Waits for the approval the environment asks for. Only a run whose ref is main may use it, which a run started
    # from CI's completed run is, and a pull request's or a pushed branch's own workflow is not.
    environment: production
    # One group for each tag. A release that waits for its approval holds its group, and with one group for all of
    # them a third release would cancel the second without anyone refusing it. Two releases are never deployed at
    # once because one person approves them, one at a time. Nothing orders two lines' releases: which of
    # release/0.7's and release/0.8's is deployed last is the approver's choice.
    concurrency:
      group: deploy-prod-${{ needs.release-tag.outputs.tag }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # true only when the repository's stack was deployed without a model key on purpose.
      DEPLOY_WITHOUT_MODEL_KEY: ${{ vars.DEPLOY_WITHOUT_MODEL_KEY }}
      # The emails that may make an account, from the production environment's secret; unset, sign-up is closed. A
      # secret, not a variable, as on staging: this repository's logs are public, and a variable's value is printed.
      SIGN_UP: ${{ secrets.SIGN_UP }}
      # Where Cloudflare's own traces and logs of the Worker are sent: a collector's https address (a variable) and
      # the authorization header it asks for (a secret). Both unset, the stack declares no destination.
      TELEMETRY_COLLECTOR_URL: ${{ vars.TELEMETRY_COLLECTOR_URL }}
      TELEMETRY_COLLECTOR_AUTHORIZATION: ${{ secrets.TELEMETRY_COLLECTOR_AUTHORIZATION }}
    steps:
      # The release commit: the one CI checked and the guard passed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # Asked again after the approval, which may come days after the guard ran, and on every re-run of this job (a
      # re-run takes the guard's old answer): the commit is still the head of its release branch and still carries
      # the tag. A release that a later one on its line has replaced fails here, so approving an old run cannot put
      # production back. When git cannot say, the job fails. `git ls-remote` lists every ref whose name ends as the
      # one asked for, so only the line whose name is exactly the branch's, or the tag's commit's, is read: a branch
      # named `a/refs/heads/release/1.0` answers for nothing.
      - name: Deploy only a release that is still its branch's head
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          CHECKED: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ needs.release-tag.outputs.tag }}
        run: |
          head="$(git ls-remote origin "refs/heads/$BRANCH" | awk '$2 == "refs/heads/" ENVIRON["BRANCH"] { print $1 }')"
          tagged="$(git ls-remote origin "refs/tags/$TAG^{}" | awk '$2 == "refs/tags/" ENVIRON["TAG"] "^{}" { print $1 }')"
          if [ -z "$head" ] || [ -z "$tagged" ]; then
            echo "git could not say where $BRANCH and $TAG are, so nothing is deployed." >&2
            exit 1
          fi
          if [ "$head" != "$CHECKED" ] || [ "$tagged" != "$CHECKED" ]; then
            echo "Not deploying $TAG at $CHECKED: $BRANCH is at $head and $TAG at $tagged now. A later release of this line took its place." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The plan, then the guard on it, as in the preview's job.
      - name: Show the plan
        run: |
          bunx alchemy deploy --stage prod --dry-run --yes > "$RUNNER_TEMP/plan.txt" 2>&1 && said=0 || said=$?
          cat "$RUNNER_TEMP/plan.txt"
          exit "$said"
      - name: Stop a plan that loses the database
        run: bun run beep infra plan-check "$RUNNER_TEMP/plan.txt"
      - name: Deploy production
        run: bunx alchemy deploy --stage prod --yes
