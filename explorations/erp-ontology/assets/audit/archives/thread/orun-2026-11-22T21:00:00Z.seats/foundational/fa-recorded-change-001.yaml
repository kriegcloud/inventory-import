id: fa:recorded-change:001
hypothesis_ref: dh:recorded-change:001
identity_card_ref: ic:recorded-change:001
tests:
  spec_vs_execution: separated
  world_vs_information: separated
  role_vs_bearer: separated
  context_reification_needed: true
rival_models:
- label: 'Process: extended import activity composed of several change events.'
  still_viable: true
- label: 'Situation: resulting changed data state, distinguished from the transition.'
  still_viable: true
- label: Information assertion of a change where occurrence is unverified; not an actual event instance.
  still_viable: true
strongest_counterexample: One import command changes eleven items and emits multiple entries, or two commands
  independently make equivalent transitions at the same reported time. Counting entries or matching state
  transitions does not decide how many change events occurred.
verdict: explicitly_deferred
needed_evidence: Specify event granularity and transaction/command/item boundaries using one multi-item
  example and failed/partial execution examples; provide execution evidence before asserting any particular
  change happened.
