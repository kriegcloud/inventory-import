source_span: {start_line: 556, end_line: 560}
quote: "The auditor's adversary failed AuditEntry and `recordedActor` because CQ-P10 asked who did each recorded act, and an audit entry is a record about a change, not the change, and cannot prove who made it. I chose to reword the question to ask about the entries: what does each audit entry say was done, which member does it name, and when was it written. The terms stay as decision 98 set them. The change itself stays a parked candidate. The agent recommended the same."
