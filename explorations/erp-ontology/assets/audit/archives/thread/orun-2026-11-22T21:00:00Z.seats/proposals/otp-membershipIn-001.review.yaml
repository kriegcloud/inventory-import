  - "Replace the null discriminator. po:sha256:b6cf8430342dae4086e8ead460bc512ca46497f17efdee0f46ac2e1d4ceb075a can comment a tenantId foreign key."
attacks:
  - surface: identity
    rule: "identity-criterion-underspecified"
    counterexample: "Membership episode M starts in tenant A and is transferred to tenant B without removal and recreation. The criterion says the same relation is the same episode and the same tenant bearer. Transfer rules are absent on the membership card. Keeping one episode identifies a context that changed tenant; splitting by tenant separates one episode into two relations. The criterion does both."
    outcome: landed
  - surface: warrant
    rule: "cq-mismatch"
    counterexample: "CQ-P06 asks who the members of this organization are. membershipIn's range is Tenant, a workspace role. po:sha256:f06f5414bdd1e4bb71616923bd5302bd87856d08eb6d6d3fe12eb852639d6b7b includes a company the tenant buys from as an organization. That company's members are in the question and are not in any Tenant, so membershipIn returns no row for them. The property does not answer the CQ it cites. CQ-P09's belonging question is likewise about organizations, not only workspace roles."
    outcome: landed
  - surface: null_discriminator
    rule: "discriminator-true-of-dto"
    counterexample: "Pure-DTO twin: a tenantId foreign key commented with po:sha256:b6cf8430342dae4086e8ead460bc512ca46497f17efdee0f46ac2e1d4ceb075a ('Links a membership to the tenant it lets its person act in') and po:sha256:e2f038bb00ccc4ebab80ef1dc9d445758de2d5f5d53e4f6865ce6e18f4db735c. The discriminator says this context has access significance beyond a syntactic link. The observations are those sentences, which the foreign key still has."
    outcome: landed
