quote: "A question the carried-through reports raised: with no `Person` term, the thread's fixture was two `Member` records and nothing said they were one human. I chose to bring `Person` into the thread, under `gist:Person`, with one link from `Member` to the person and no name or email paths (decision 93 stands). The agent recommended the same."
