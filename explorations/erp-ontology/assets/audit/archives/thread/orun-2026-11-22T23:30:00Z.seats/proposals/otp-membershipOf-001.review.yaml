revision_requests:
  - "CQ-P06's one-human-two-members sample can keep membershipOf as support for Member. The joined discriminator cannot: po:0fd580baa7d4 and po:8b535e25c8a2 are already true as the meaning of member rows plus a person link stored beside them. Cite a fact that arrangement lacks."
attacks:
  - surface: null_discriminator
    rule: discriminator-true-of-dto
    counterexample: "Two Member rows, test_RaviWorks and test_RaviSecond, share a person foreign key and each lasts only until removal (po:8b535e25c8a2). po:0fd580baa7d4 is the decision to add that link because the rows alone did not say they were one human. A member table plus a person-id column makes the human/membership split and the authorization interval true without a domain relator. The discriminator, which only contrasts a display or session record, stays true of this twin."
    outcome: landed
  - surface: warrant
    rule: support-not-necessary
    counterexample: "CQ-P06's decision is whether a person may be offered an action in one organization and nowhere else. The sample is one person with two memberships. membershipOf is how Member points at that human, and po:0fd580baa7d4 says the member rows do not say it by themselves. The property is necessary for the decision term Member. The warrant survives; the discriminator does not."
    outcome: survived
  - surface: identity
    rule: identifier-is-identity
    counterexample: "Re-adding the same human in the same tenant under a reused MemberId fits two establishments or one suspended relation. The proposal does not mint a property individual and does not treat MemberId or the person-tenant pair as the criterion. No false identity claim is added for the property."
    outcome: survived
