revision_requests:
  - "State whether repointing a grant from membership M1 to M2 is a correction of one conferral or a new grant. The criterion currently makes that one relation and two."
  - "CQ-P06 does not require a grant-to-member property. A role on the membership answers who holds which role. Drop the decision-term citation or show why the listing is unanswerable without grantedTo."
